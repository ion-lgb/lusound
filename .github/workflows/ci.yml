# Continuous verification for what can run without secrets, samples or a device.
#
# Deliberately NOT here, because each needs something a hosted runner cannot have:
#   - :app:assembleRelease  needs the private release keystore (LUSOUND_KEYSTORE and friends)
#   - connectedDebugAndroidTest  needs an unlocked device plus a real NCM sample, two FLAC
#     metadata samples, a Navidrome fixture on :4534 and a Jellyfin fixture on :8097
# See docs/testing.md for how to run those locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # No third-party setup action is used here. The image ships the Android SDK with ANDROID_HOME set,
      # but it does not reliably ship cmdline-tools on PATH (the first release run reported
      # "sdkmanager: command not found"), so the step below finds the tool itself and then verifies the
      # packages the build needs by looking at the filesystem.      # compileSdk 37 and build-tools 36.0.0, matching the locally verified toolchain. The API 37
      # platform uses the new minor-versioned package id, so both spellings are tried and the available
      # ids are printed. This step is best-effort on purpose: if a package is missing the build fails
      # with the real compiler error, which is more useful than a setup step failing first.
      - name: Ensure the pinned Android toolchain
        run: |
          set -uo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "sdk root: ${sdk_root:-unset}"
          # The runner image does not always put cmdline-tools on PATH, and may not ship them at all,
          # so sdkmanager is located rather than assumed. It is only used to top the image up.
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ] && [ -n "$sdk_root" ]; then
            sdkmanager_bin="$(ls -1 "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          fi
          echo "sdkmanager: ${sdkmanager_bin:-not found}"
          if [ -n "$sdkmanager_bin" ]; then
            yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-37.0" "build-tools;36.0.0" \
              || "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-37" "build-tools;36.0.0" \
              || echo "::warning::sdkmanager could not install the pinned packages"
          else
            echo "::warning::sdkmanager is unavailable; relying on the packages already in the image"
          fi
          # What the build actually needs is these directories. Checking the filesystem needs no tooling
          # and fails here, with a clear message, instead of as a confusing compiler error later.
          if [ ! -d "$sdk_root/platforms/android-37.0" ]; then
            echo "::error::compileSdk 37 is missing from this image: $sdk_root/platforms/android-37.0"
            ls -1 "$sdk_root/platforms" 2>/dev/null || true
            exit 1
          fi
          echo "platforms present:"; ls -1 "$sdk_root/platforms"
          if [ ! -d "$sdk_root/build-tools/36.0.0" ]; then
            echo "::warning::build-tools 36.0.0 is missing; the build will use another installed version"
            ls -1 "$sdk_root/build-tools" 2>/dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        continue-on-error: true

      - name: Assemble, unit test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
